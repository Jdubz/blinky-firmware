# Tracker A/B (#340): the same harness binary on edm/, once with its defaults
# ("old") and once with the given --name=value options ("new"), every metric
# side by side: drum scores, repetition consistency, rhythm. Manual only; it
# gates nothing. Use it to measure one suspect at a time before any firmware
# change (CLAUDE.md: root causes, measured).
#
#   gh workflow run tracker-ab.yml -f opts="--onset-pattern-bias=0"
#
# With `base`, "old" is instead the harness built from that git ref's firmware
# (defaults, no options), so a firmware change can be measured before/after on
# the corpus pinned by the ref the workflow runs on (both sides, same labels):
#
#   gh workflow run tracker-ab.yml --ref my-branch -f base=staging -f opts=""
name: Tracker A/B

on:
  workflow_dispatch:
    inputs:
      opts:
        description: "space-separated --name=value harness options for the 'new' side (may be empty with base)"
        required: false
        default: ""
      base:
        description: "optional git ref: build the 'old' harness from this ref's firmware instead"
        required: false
        default: ""
      fps:
        description: "simulated loop rates"
        default: "35 60 90"

permissions:
  contents: read

jobs:
  ab:
    name: Tracker A/B (${{ inputs.base && format('vs {0} ', inputs.base) || '' }}${{ inputs.opts }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Corpus submodule
      run: git submodule update --init --depth 1 corpus

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python deps
      run: pip install numpy imageio-ffmpeg

    - name: Build harness
      run: |
        mkdir -p build
        g++ -std=c++17 -O2 -DBLINKY_HOST_HARNESS -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840 \
          -Iblinky-simulator/include -Iblinky-things \
          tests/tracker/tracker_harness.cpp blinky-things/audio/AudioTracker.cpp \
          blinky-things/audio/SharedSpectralAnalysis.cpp blinky-things/inputs/AdaptiveMic.cpp \
          blinky-things/types/BlinkyAssert.cpp -o build/tracker_harness

    # The old side is the harness exactly as `base` builds it (its firmware and its
    # harness program); the eval scripts and the corpus stay this ref's, so both sides
    # are scored on the same labels.
    - name: Build base harness
      if: inputs.base != ''
      env:
        BASE: ${{ inputs.base }}
      run: |
        git rev-parse --verify "origin/$BASE^{commit}" >/dev/null 2>&1 && ref="origin/$BASE" || ref="$BASE"
        echo "base: $ref = $(git rev-parse "$ref^{commit}")"
        mkdir -p build/base
        git archive "$ref" blinky-things blinky-simulator tests/tracker | tar -x -C build/base
        cd build/base
        g++ -std=c++17 -O2 -DBLINKY_HOST_HARNESS -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840 \
          -Iblinky-simulator/include -Iblinky-things \
          tests/tracker/tracker_harness.cpp blinky-things/audio/AudioTracker.cpp \
          blinky-things/audio/SharedSpectralAnalysis.cpp blinky-things/inputs/AdaptiveMic.cpp \
          blinky-things/types/BlinkyAssert.cpp -o ../tracker_harness_base

    - name: A/B on edm/
      env:
        OPTS: ${{ inputs.opts }}
        BASE: ${{ inputs.base }}
        FPS: ${{ inputs.fps }}
      shell: bash  # Actions adds -o pipefail: a failed eval must fail the step through tee
      run: |
        old=build/tracker_harness
        [ -n "$BASE" ] && old=build/tracker_harness_base
        [ -n "$OPTS" ] || [ -n "$BASE" ] || { echo "::error::give opts, base, or both"; exit 1; }
        args=()
        for o in $OPTS; do
          case "$o" in --[a-z]*=*) args+=("--harness-opt=$o") ;; *) echo "::error::not a --name=value option: $o"; exit 1 ;; esac
        done
        python tests/tracker/run_tracker_eval.py --harness build/tracker_harness \
          --compare "$old" --fps $FPS "${args[@]}" | tee ab.txt
        { echo '```'; echo "new = this ref ${OPTS:+with $OPTS}, old = ${BASE:-this ref} defaults"; grep -E '^(new|old):' ab.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
