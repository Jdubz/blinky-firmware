# Build the staging firmware (docs/RELEASE_PROCESS.md, "Staging").
#
# Every push to staging that passes PR Validation is compiled with the pinned
# toolchain, packaged with the release validators (tools/firmware_release.py
# package --dev) and uploaded as the workflow artifact `staging-firmware`.
# It is NOT a release: version b<N>-dev-<sha8>, unsigned, test devices only.
# The test box's staging runner (scripts/testbox/staging.py) downloads it,
# flashes the test chips and runs the hardware suite, then posts the
# "Hardware test (staging)" status on the commit. A PR staging -> master
# needs that status.
#
# It also posts the "Firmware fingerprint" status: one sha256 over the hex and
# UF2 that `package` makes from the sketch compiled with every per-commit field
# fixed (scripts/build.sh --fingerprint). Those are exactly the files a staging
# build or candidate ships, so two commits with the same fingerprint put the
# same image on a device: the box skips the hardware suite for a head whose
# fingerprint equals the one master was last merged from, and release.yml cuts
# no candidate for one equal to the newest bN's. That image is never uploaded.
#
# workflow_run runs this file from the default branch (staging).
name: Staging build

on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]
    branches: [staging]

permissions:
  contents: read
  actions: read
  statuses: write   # the Firmware fingerprint status

concurrency:
  group: staging-build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build staging firmware
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the validated commit
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
      with:
        version: 1.3.1   # = tools/firmware_toolchain.json arduino_cli

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pinned toolchain
      run: |
        pip install adafruit-nrfutil pyserial
        bash scripts/setup_toolchain.sh

    # Fixed version fields and its own build/cache paths (scripts/build.sh): shares no
    # object with the real build below. A commit from before --fingerprint has none.
    - name: Fingerprint build
      id: fp
      run: |
        if ! grep -q -- '--fingerprint)' scripts/build.sh; then
          echo "::notice title=Fingerprint::this commit's build.sh has no --fingerprint; none posted"
          exit 0
        fi
        bash scripts/build.sh --fingerprint
        # The same validators and UF2 conversion as the real package step; the manifest
        # (version, toolchain) is not part of the fingerprint.
        python tools/firmware_release.py package --dev \
          --hex /tmp/blinky-fingerprint/out/blinky-things.ino.hex \
          --build 0 --sha 0000000000000000000000000000000000000000 \
          --out /tmp/blinky-fingerprint/dist --toolchain-json '{}' \
          --libraries-json /tmp/blinky-fingerprint/out/libraries.json
        fp=$(cd /tmp/blinky-fingerprint/dist && sha256sum blinky-things-b0.hex blinky-things-b0.uf2 | sha256sum | cut -d' ' -f1)
        [[ "$fp" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad fingerprint '$fp'"; exit 1; }
        echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
        echo "::notice title=Fingerprint::sha256:$fp"

    # --dev: no bump, version b<N>-dev-<sha8> from BUILD_NUMBER and the commit.
    - name: Build firmware
      run: bash scripts/build.sh --dev

    - name: Package and validate
      env:
        SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        N=$(tr -d '[:space:]' < blinky-things/BUILD_NUMBER)
        TFLITE_REF=$(sed -n 's/^TFLITE_REF="${TFLITE_REF:-\([0-9a-f]*\)}"$/\1/p' tools/setup_tflite_lib.sh)
        [ -n "$TFLITE_REF" ] || { echo "::error::TFLITE_REF pin not found in setup_tflite_lib.sh"; exit 1; }
        TC=$(jq -c --arg tflite "$TFLITE_REF" --arg cli "$(arduino-cli version | head -1)" \
               '{core: .core, libraries: .libraries, fqbn: .fqbn, tflite_ref: $tflite, arduino_cli: $cli}' \
               tools/firmware_toolchain.json)
        python tools/firmware_release.py package --dev \
          --hex /tmp/blinky-build/blinky-things.ino.hex \
          --build "$N" --sha "$SHA" \
          --out dist --toolchain-json "$TC" \
          --libraries-json /tmp/blinky-build/libraries.json
        # The firmware must report exactly the manifest's version.
        want=$(jq -r .version dist/manifest.json)
        grep -q "\"$want\"" blinky-things/types/Version.h || {
          echo "::error title=Staging build::Version.h does not carry $want"; cat blinky-things/types/Version.h; exit 1; }
        ls -la dist

    # Before the upload: the box only reads a fingerprint once the image exists, so posting
    # it first means the image is never visible without its fingerprint.
    - name: Post the fingerprint
      if: steps.fp.outputs.fingerprint != ''
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.event.workflow_run.head_sha }}
        FP: ${{ steps.fp.outputs.fingerprint }}
      run: |
        gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
          -f state=success -f context="Firmware fingerprint" -f description="sha256:$FP" >/dev/null

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        # Named for the built commit: a workflow_run run's own head_sha is the
        # default branch's tip when it started, not necessarily this commit.
        name: staging-firmware-${{ github.event.workflow_run.head_sha }}
        path: dist/
        retention-days: 30
        if-no-files-found: error
