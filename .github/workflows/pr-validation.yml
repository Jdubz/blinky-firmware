name: PR Validation

on:
  # Draft PRs run only the cheap checks (seconds each); the heavy jobs (compile, cppcheck,
  # both tracker harnesses, timing, the mel contract, model input, OTA manifest) wait until
  # the PR is ready for review: marking it ready (ready_for_review) starts a run with all of
  # them (blinky_time docs/DEV_LOOP.md, section 4). A heavy job skipped on a draft reports
  # "skipped", which a required check accepts; GitHub never merges a draft, and the ready
  # run's results replace the skipped ones on the same head. Re-running a run made while the
  # PR was a draft replays its event and skips them again: mark the PR ready instead.
  pull_request:
    branches: [ master, staging ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  # Also validate master and staging themselves: two PRs that each pass alone
  # can still break together once both are merged. A green run on a staging
  # push starts the staging firmware build (staging-build.yml).
  push:
    branches: [ master, staging ]

jobs:
  # Which slow checks this change needs. The tracker harnesses (~5-6 min each) replay the
  # corpus through the audio pipeline, so they run only when something they build or read
  # changed. They stay required checks: a job skipped by its own `if` reports success, while
  # a workflow-level path filter would leave a required check waiting forever.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      audio: ${{ steps.diff.outputs.audio }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Diff against the base
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "$EVENT" = pull_request ]; then
          range="origin/$BASE_REF...HEAD"
        elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          range="$BEFORE..HEAD"
        else
          echo "no base to diff against: run everything"
          echo "audio=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # --no-renames: a move lists both paths, so moving a file out of a watched tree still
        # runs the trackers.
        git diff --name-only --no-renames "$range" > changed.txt
        echo "changed ($range):"; cat changed.txt
        # What the tracker harnesses compile (g++ -MM of tracker_harness.cpp, AudioTracker,
        # SharedSpectralAnalysis, AdaptiveMic, BlinkyAssert), their scripts, the TFLite pin
        # the NN harness builds against, the corpus they replay (and .gitmodules, which decides
        # what its checkout fetches), and this workflow.
        audio='^(blinky-things/audio/|blinky-things/hal/|blinky-things/inputs/AdaptiveMic\.|blinky-things/types/BlinkyAssert\.|blinky-simulator/include/|tests/tracker/|tests/unit/test_sliding_acf\.cpp$|tools/setup_tflite_lib\.sh$|tools/firmware_toolchain\.json$|corpus$|\.gitmodules$|\.github/workflows/pr-validation\.yml$)'
        if grep -qE "$audio" changed.txt; then
          echo "audio=true" >> "$GITHUB_OUTPUT"
          echo "audio pipeline or harness changed: the tracker harnesses run"
        else
          echo "audio=false" >> "$GITHUB_OUTPUT"
          echo "nothing the tracker harnesses build or read changed: they skip"
        fi

  compile:
    name: Compile Firmware
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`).
    if: ${{ github.event.pull_request.draft != true }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
      with:
        version: 1.3.1   # = tools/firmware_toolchain.json arduino_cli

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # The pinned, isolated toolchain (scripts/setup_toolchain.sh, #252), the
    # same one release builds and every workstation use, so this check
    # compiles exactly what devices run.
    - name: Install pinned toolchain
      run: |
        pip install adafruit-nrfutil
        bash scripts/setup_toolchain.sh

    - name: Compile sketch (scripts/build.sh, as releases do)
      run: bash scripts/build.sh --build 0

  cppcheck:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`).
    if: ${{ github.event.pull_request.draft != true }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # Pinned: Ubuntu's apt cppcheck (2.13 on 24.04) misses findings that 2.16
    # reports, so CI passed code that failed locally (#201). Built from source
    # once and cached by version.
    - name: Cache cppcheck
      id: cppcheck-cache
      uses: actions/cache@v4
      with:
        path: ~/cppcheck
        key: cppcheck-2.16.0-${{ runner.os }}

    - name: Build cppcheck 2.16.0
      if: steps.cppcheck-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch 2.16.0 https://github.com/danmar/cppcheck.git /tmp/cppcheck-src
        cmake -S /tmp/cppcheck-src -B /tmp/cppcheck-build -DCMAKE_BUILD_TYPE=Release           -DUSE_MATCHCOMPILER=ON -DCMAKE_INSTALL_PREFIX=$HOME/cppcheck
        cmake --build /tmp/cppcheck-build -j"$(nproc)"
        cmake --install /tmp/cppcheck-build

    - name: Run cppcheck
      run: |
        export PATH="$HOME/cppcheck/bin:$PATH"
        cppcheck --version | grep -qx 'Cppcheck 2.16.0' || { cppcheck --version; echo "wrong cppcheck version"; exit 1; }
        cppcheck \
          --enable=warning,style,performance,portability \
          --error-exitcode=1 \
          --suppressions-list=.cppcheck-suppressions \
          --inline-suppr \
          -I blinky-things/ \
          --std=c++14 \
          --platform=native \
          --quiet \
          blinky-things/

  ota-manifest:
    name: OTA Manifest (firmware verifier vs release signer)
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`).
    if: ${{ github.event.pull_request.draft != true }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Vectors are current
      run: |
        pip install cryptography
        python tools/ota_manifest.py vectors --out /tmp/vectors.h
        diff -u tests/ota/vectors.h /tmp/vectors.h || {
          echo "::error::tests/ota/vectors.h is stale: run python tools/ota_manifest.py vectors --out tests/ota/vectors.h"; exit 1; }

    - name: Build and run (firmware's own Monocypher units, -std=gnu++11 like the core)
      run: |
        mkdir -p build
        gcc -c -O1 -Wall -I blinky-things blinky-things/OtaMonocypher.c -o build/mc.o
        gcc -c -O1 -Wall -I blinky-things blinky-things/OtaMonocypherEd25519.c -o build/mc_ed.o
        g++ -std=gnu++11 -Wall -Wextra -Werror -O1 -I blinky-things -I tests/ota           tests/ota/ota_manifest_test.cpp build/mc.o build/mc_ed.o -o build/ota_manifest_test
        build/ota_manifest_test

  led-mapper:
    name: LED Mapper (orientations)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # Every orientation maps each LED exactly once; one with no mapping is refused.
    - name: Build and run (UBSan)
      run: |
        mkdir -p build
        g++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=undefined -fno-sanitize-recover=all \
          -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840 -I blinky-simulator/include -I blinky-things \
          tests/unit/test_led_mapper.cpp -o build/test_led_mapper
        build/test_led_mapper

    # testpattern (camera calibration): fills, and the flash train's schedule and edge stamps.
    # PixelMatrix.cpp's existing -Wreorder / -Wclass-memaccess are relaxed for that file only.
    - name: Test patterns (UBSan)
      run: |
        FLAGS="-std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=undefined -fno-sanitize-recover=all \
          -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840 -I blinky-simulator/include -I blinky-things \
          -I blinky-things/types"
        g++ $FLAGS -Wno-reorder -Wno-class-memaccess -c blinky-things/types/PixelMatrix.cpp -o build/PixelMatrix.o
        g++ $FLAGS -c blinky-things/types/BlinkyAssert.cpp -o build/BlinkyAssert.o
        g++ $FLAGS tests/unit/test_test_pattern.cpp build/PixelMatrix.o build/BlinkyAssert.o -o build/test_test_pattern
        build/test_test_pattern

    # leds (the test box's runtime brightness override): the parser refuses what it doesn't
    # name; the override reaches the strip; `config` returns to the device config's brightness.
    - name: LED brightness override (UBSan)
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=undefined -fno-sanitize-recover=all \
          -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840 -I blinky-simulator/include -I blinky-things \
          tests/unit/test_led_brightness.cpp -o build/test_led_brightness
        build/test_led_brightness

    # The settings journal (#49) on a simulated NOR flash: no erase at run time after
    # boot, every save read back, a power cut after any word keeps the old or new state.
    - name: Settings journal (UBSan + ASan)
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=undefined,address -fno-sanitize-recover=all \
          -I blinky-things tests/unit/test_settings_journal.cpp blinky-things/config/SettingsJournal.cpp \
          -o build/test_settings_journal
        build/test_settings_journal

    # The stream's float formatting (#23) matches printf("%.*f") byte for byte:
    # exact ties at every precision, signed zero, millions of random floats.
    - name: Stream float formatting (UBSan)
      run: |
        # -Ofast too: the firmware core builds with it (-ffinite-math-only, -fno-signed-zeros).
        for opt in -O1 -Ofast; do
          g++ -std=c++17 -Wall -Wextra -Werror $opt -g -fsanitize=undefined -fno-sanitize-recover=all \
            -I blinky-things tests/unit/test_fixed_float.cpp -o build/test_fixed_float
          build/test_fixed_float
        done

  timing:
    # Quoted: unquoted, YAML reads ` #259-#261)` as a comment and the check is named "...phase,".
    name: "Absolute Timing (generators + rhythm phase, #259-#261)"
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`).
    if: ${{ github.event.pull_request.draft != true }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # A 2 s frame must land where 2 s of frames would (no stretched
    # animation); the rhythm phase extrapolation is capped and monotonic.
    # UBSan: a long frame must not overflow the physics either.
    - name: Build and run (UBSan)
      run: |
        mkdir -p build
        g++ -std=c++17 -Wall -Wextra -O1 -g -fsanitize=undefined,float-cast-overflow,float-divide-by-zero           -fno-sanitize-recover=all -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840           -I blinky-simulator/include -I blinky-things tests/timing/timing_test.cpp           blinky-things/types/PixelMatrix.cpp blinky-things/types/BlinkyAssert.cpp           blinky-things/physics/PhysicsContext.cpp blinky-things/particles/Particle.cpp           blinky-things/math/SimplexNoise.cpp blinky-things/generators/Fire.cpp           blinky-things/generators/Water.cpp blinky-things/generators/PlasmaGlobe.cpp           blinky-things/generators/Audio.cpp -o build/timing_test
        build/timing_test

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # The bench side of the same property: the release gate's beatpace check compares the
    # beats a device counts with its tempo integrated over wall-clock time (#258).
    - name: Release gate beat-pace arithmetic
      run: |
        pip install pytest pyserial
        python -m pytest -v tests/tools/test_release_gate.py tests/tools/test_staging_download.py tests/tools/test_uf2_upload_ports.py

  static-init-safety:
    name: Static Init Safety Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check for dangerous static initialization
      run: |
        echo "Checking for static initialization order fiasco patterns..."
        echo "These patterns can brick devices by crashing before setup() runs."
        echo ""
        python scripts/check_static_init.py blinky-things/

  syntax-validation:
    name: Syntax Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run syntax validation
      run: |
        python tools/validate_syntax.py blinky-things/

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Check include guards
      run: |
        echo "Checking include guards..."
        missing_guards=""
        for file in $(find blinky-things/ -name "*.h" -type f); do
          if ! grep -q "#pragma once" "$file" && ! grep -q "#ifndef.*_H" "$file"; then
            missing_guards="$missing_guards\n  - $file"
          fi
        done
        if [ -n "$missing_guards" ]; then
          echo "❌ Missing include guards in:$missing_guards"
          exit 1
        fi
        echo "✅ All header files have include guards"

    - name: Check for debug code
      run: |
        echo "Checking for leftover debug code..."
        # These are warnings, not failures
        if grep -rn "TODO\|FIXME\|HACK\|XXX" blinky-things/ --include="*.cpp" --include="*.h" --include="*.ino" 2>/dev/null; then
          echo "⚠️  Found TODO/FIXME comments (not blocking)"
        else
          echo "✅ No TODO/FIXME comments found"
        fi

    - name: Check for large files
      run: |
        echo "Checking for overly large source files..."
        large_files=""
        for file in $(find blinky-things/ -name "*.cpp" -o -name "*.h" -o -name "*.ino" | head -100); do
          lines=$(wc -l < "$file")
          if [ "$lines" -gt 1000 ]; then
            large_files="$large_files\n  - $file ($lines lines)"
          fi
        done
        if [ -n "$large_files" ]; then
          echo "⚠️  Large files found (consider splitting):$large_files"
        else
          echo "✅ No overly large files"
        fi

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Check required files
      run: |
        echo "Checking documentation completeness..."
        missing=""
        for file in README.md LICENSE CONTRIBUTING.md; do
          if [ ! -f "$file" ]; then
            missing="$missing $file"
          fi
        done
        if [ -n "$missing" ]; then
          echo "❌ Missing required files:$missing"
          exit 1
        fi
        echo "✅ All required documentation files present"

    - name: No network topology (the repo is public)
      # Host names, private/tailnet addresses and mDNS names belong in ~/.config/blinky/, never
      # here; justified exceptions go in .topology-allowlist.
      run: python3 scripts/check_topology.py

    - name: Check version file
      run: |
        if [ -f "VERSION" ]; then
          echo "✅ VERSION file exists: $(cat VERSION)"
        else
          echo "⚠️  VERSION file not found"
        fi

  tracker-harness:
    name: Tracker Harness (UBSan stress + corpus gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Heavy: skipped on a draft PR (see `on:`). Otherwise skipped unless the audio pipeline or
    # the harness changed (job `changes`); runs if that job itself failed, so a broken diff can
    # never skip it silently.
    needs: changes
    if: ${{ always() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.audio == 'true') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # The corpus (and its scorers) only: the bootloader submodule isn't needed.
    - name: Corpus submodule
      run: git submodule update --init --depth 1 corpus

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python deps
      run: pip install numpy imageio-ffmpeg pytest

    - name: Repetition consistency metric tests (#340)
      run: python -m pytest -q tests/tracker/test_consistency.py

    - name: Build harness (UBSan and release)
      run: |
        mkdir -p build
        SRCS="tests/tracker/tracker_harness.cpp blinky-things/audio/AudioTracker.cpp \
          blinky-things/audio/SharedSpectralAnalysis.cpp blinky-things/inputs/AdaptiveMic.cpp \
          blinky-things/types/BlinkyAssert.cpp"
        FLAGS="-std=c++17 -DBLINKY_HOST_HARNESS -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840 \
          -Iblinky-simulator/include -Iblinky-things"
        # GCC's -fsanitize=undefined omits the float checks; the tracker casts
        # floats to int (lags, pattern bins), so add them explicitly.
        g++ $FLAGS -O1 -g -fsanitize=undefined,float-cast-overflow,float-divide-by-zero \
          -fno-sanitize-recover=all $SRCS -o build/tracker_harness_ubsan
        g++ $FLAGS -O2 $SRCS -o build/tracker_harness

    # The incremental ACF tables (blinky-things/audio/SlidingAcf.h) against a from-scratch
    # sum (exact, bit for bit, through filling, wrapping and held updates) and against the
    # old float batch ACF (at least as accurate).
    - name: Incremental ACF exactness (UBSan)
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=undefined,float-cast-overflow,float-divide-by-zero \
          -fno-sanitize-recover=all -Iblinky-things tests/unit/test_sliding_acf.cpp -o build/test_sliding_acf
        build/test_sliding_acf

    # Every tempo decision on edm/ (incremental tables, spread over the acfPeriodMs cycle)
    # must equal the old batch runAcf's on the same snapshot (tests/tracker/acf_reference.h):
    # same period, multiplier and source, periodF within 1e-3 frames, phase within 1e-4.
    - name: Tempo decisions equal the batch ACF (edm/)
      run: python tests/tracker/acf_equivalence.py --harness build/tracker_harness

    - name: Onset STFT matches a numpy SuperFlux (#178)
      run: TRACKER_HARNESS=build/tracker_harness python -m pytest -q tests/tracker/test_onset_stft.py

    - name: UBSan stress (silence, gap, clip, noise, hum, clicks at 15/60/250 fps)
      run: python tests/tracker/run_stress.py --harness build/tracker_harness_ubsan

    # CPU cost model calibrated to hat_v1 (tests/tracker/README.md). The
    # device build (NN off) must leave the renderer its frame rate: 177 fps
    # simulated, matching the hat's measured 179 fps.
    # Frame cost: 3.2 ms measured on hat_v1 before the onset STFT (#178),
    # plus an estimated 2 x 0.7 ms for its two frames until timed on device.
    - name: Frame-rate gate (device build, hat CPU cost model)
      run: |
        head -c $((16000*2*20)) /dev/urandom > /tmp/noise.pcm
        build/tracker_harness /tmp/noise.pcm /tmp/out.csv 60 0.25 1 --nn-cost-us=12000 --frame-cost-us=4600 --render-cost-us=4500 2> /tmp/cost.log
        cat /tmp/cost.log
        fps=$(grep -o ' fps=[0-9.]*' /tmp/cost.log | cut -d= -f2)
        if [ -z "$fps" ] || awk "BEGIN{exit !($fps < 150)}"; then
          echo "::error title=Frame rate::simulated device fps '$fps' < 150: audio work is starving the renderer"
          exit 1
        fi

    # The corpus plays at the device's level (run_tracker_eval.py --level-db,
    # default -50 dB re the mastered file, int16): hat_v1's mic peaks at
    # ~0.003 FS with music, and file-level testing hid a detector that fired
    # nothing on the device (#280). Floors sit just under the device-level
    # baseline on edm/ at 35/60/90 fps: excess 0.081, tempo 0.678, recall
    # 0.642. Tempo was 0.726 at file level with the same tracker: the rhythm
    # path (bass flux of compressed linear magnitudes) is level-sensitive,
    # an open issue the file-level gate never saw. Recall is against ALL
    # strong consensus onsets (hats included), a secondary number: the
    # detector targets kicks and snares (CLAUDE.md); at device level the old
    # picker scored 0.374. Raise the floors as the tracker improves.
    # Recall re-baselined for the onset STFT (#178, delta 8): 0.590, down from
    # 0.642 because lone hats stopped firing (0.464 -> 0.254 of them), which
    # is the intent; snare recall also fell (0.727 -> 0.629, not gated).
    #
    # The drum floors are the PRIMARY gate (#294): kick recall at +-50 ms,
    # on-drum share and drum F against the corpus's drum labels
    # (blinky-corpus: blinky_scoring/drum_scoring.py drum_label_path: complete
    # human ground truth, else ADTOF). Re-anchored 2026-11-24 when the labels
    # moved from the band-onset generator to ADTOF (corpus a57b38a, blinky-corpus
    # #5/#6), keeping the old floors' ~0.02 margins under the baseline. Baseline
    # (staging, overlapped onset STFT), means over 35/60/90 fps: kick R 0.890,
    # on-drum 0.570, drum F 0.620, repS 0.715 (against the band labels it was
    # 0.789 / 0.583 / 0.638). Snare recall (0.891) is reported but not gated:
    # provisional until hand-curated ground truth (blinky-corpus#4).
    - name: Corpus regression gate (edm/, 35/60/90 fps)
      run: |
        python tests/tracker/run_tracker_eval.py --harness build/tracker_harness \
          --min-excess 0.07 --min-tempo 0.66 --min-recall 0.57 \
          --min-kick-recall 0.87 --min-on-drum 0.55 --min-drum-f 0.60

  model-input-check:
    name: Onset Model Input Check
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`).
    if: ${{ github.event.pull_request.draft != true }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install tflite schema parser
      run: pip install tflite==2.18.0

    # Mirrors FrameOnsetNN::begin()'s static checks on the embedded model so a
    # model the firmware would refuse fails the PR instead of silently running
    # devices without the onset NN (the 80-mel v36 export did that, initError 5).
    - name: Check embedded model against the firmware's limits
      # Also its mel front end and the bytes' hash, as FrameOnsetNN.h does (#291).
      run: python tools/check_model_input.py

    - name: The mel front-end check refuses what FrameOnsetNN.h refuses (#291)
      # A header on another front end, none, or a forged waiver hash.
      run: |
        pip install pytest
        python -m pytest -v tests/tools/test_check_model_input.py

  mel-contract:
    name: Mel Front End Contract (blinky_time#295)
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`).
    if: ${{ github.event.pull_request.draft != true }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install numpy
      run: pip install 'numpy>=1.26,<3'

    # The onset NN's input is the mel front end in tests/parity/spec/mel_frontend_v1.json and
    # its golden vectors; blinky_time carries identical copies and checks training's front end
    # against them, without this repo's source. Here: the spec is MEL_BANDS[], the constants
    # and MEL_FRONTEND_VERSION, and the real SharedSpectralAnalysis.cpp (the parity harness)
    # still produces the golden mel.
    - name: Build the parity harness and check the firmware against the contract
      run: |
        cmake -S tests/parity -B tests/parity/build -DCMAKE_BUILD_TYPE=Release
        cmake --build tests/parity/build -j
        python tests/parity/test_mel_contract.py --harness tests/parity/build/parity_harness

  tracker-harness-nn:
    name: Tracker Harness with real onset NN (host TFLite Micro)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Heavy: skipped on a draft PR (see `on:`). Otherwise skipped unless the audio pipeline or
    # the harness changed (job `changes`); runs if that job itself failed, so a broken diff can
    # never skip it silently.
    needs: changes
    if: ${{ always() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.audio == 'true') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # The corpus (and its scorers) only: the bootloader submodule isn't needed.
    - name: Corpus submodule
      run: git submodule update --init --depth 1 corpus

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
      with:
        version: 1.3.1   # = tools/firmware_toolchain.json arduino_cli

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python deps
      run: pip install numpy imageio-ffmpeg

    - name: Install TFLite Micro library
      run: |
        arduino-cli config init
        bash tools/setup_tflite_lib.sh --ci

    # Builds TFLite Micro for the host and links the harness with
    # BLINKY_HOST_NN, so FrameOnsetNN runs the embedded model (#203).
    # Host compiler pinned to GCC 13: ubuntu-latest moved to 26.04 (default
    # GCC 15.2) in Nov 2026, and the flatbuffers headers bundled with the
    # pinned TFLite library (TFLITE_REF in tools/setup_tflite_lib.sh) don't
    # compile under GCC 15 ("EndVector/VerifyOffset was not declared"). The
    # library pin stays as is: the device firmware builds from it too.
    - name: Build harness with the real onset NN
      env:
        CXX: g++-13
      run: |
        command -v "$CXX" >/dev/null || { echo "::error::$CXX is not on this runner image"; exit 1; }
        "$CXX" --version | head -1
        bash tests/tracker/build_host_nn.sh --out build/host_nn

    - name: Stress run with the NN path
      run: python tests/tracker/run_stress.py --harness build/host_nn/tracker_harness_nn

    # The embedded model must initialize: a refused model (e.g. the 80-mel
    # v36 export, initError 5) silently runs every device on the fallback
    # ODF. model-input-check catches width mismatches statically; this
    # catches everything else (ops, arena, quantization) on the real
    # interpreter.
    - name: Embedded model must initialize
      run: |
        head -c $((16000*2*20)) /dev/urandom > /tmp/noise.pcm
        # The NN harness exits 5 when the model is refused, so this doesn't
        # depend on the wording of the firmware's log line.
        rc=0; build/host_nn/tracker_harness_nn /tmp/noise.pcm /tmp/out.csv 60 > /tmp/nn.log 2>&1 || rc=$?
        if [ "$rc" -ne 0 ]; then
          cat /tmp/nn.log
          echo "::error title=Onset NN::NN harness exited $rc - the embedded model is refused (5) or the run failed"
          exit 1
        fi
        echo "Embedded onset model initializes on the host."

    # Livelock guard: with the NN on, update() must run at most one inference
    # per call and must not chase samples that arrive during it. b208-b210
    # did, and the hat fell to 12 fps (simulated 11.5; fixed loop 48.7).
    - name: Frame-rate gate with the NN (hat CPU cost model)
      run: |
        build/host_nn/tracker_harness_nn /tmp/noise.pcm /tmp/out.csv 60 0.25 1 --nn-cost-us=12000 --frame-cost-us=4600 --render-cost-us=4500 2> /tmp/cost.log
        cat /tmp/cost.log
        fps=$(grep -o ' fps=[0-9.]*' /tmp/cost.log | cut -d= -f2)
        if [ -z "$fps" ] || awk "BEGIN{exit !($fps < 35)}"; then
          echo "::error title=Frame rate::simulated fps with the NN '$fps' < 35: the drain loop is running the NN on every frame (livelock)"
          exit 1
        fi

    # Devices ship with the NN off (BLINKY_ONSET_NN_ENABLED=0), but the NN
    # path must stay correct for the day a model beats flux: same tempo /
    # phase floors as the device gate (#155: the NN as a tempo source dropped
    # corpus tempo 0.726 -> 0.621 unnoticed).
    - name: Corpus regression gate with the NN (edm/, 35/60/90 fps)
      run: |
        python tests/tracker/run_tracker_eval.py --harness build/host_nn/tracker_harness_nn           --min-excess 0.07 --min-tempo 0.66 --min-recall 0.25
